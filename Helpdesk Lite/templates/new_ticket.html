<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Helpdesk Lite - Nowe zgłoszenie</title>
</head>
<body>
    <h1>Dodaj nowe zgłoszenie</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/tickets/new">
        <div>
            <label for="user_id">Użytkownik:</label><br>
            <select name="user_id" id="user_id" required>
                <option value="">-- Wybierz użytkownika --</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.name }} ({{ u.department }})</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div>
            <label for="description">Opis zgłoszenia:</label><br>
            <textarea name="description" id="description" rows="4" cols="40" required></textarea>
        </div>
        <br>
        <div>
            <label for="priority">Priorytet:</label><br>
            <select name="priority" id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <br>
        <button type="submit">Zapisz zgłoszenie</button>
        <a href="/tickets">Anuluj</a>
    </form>
</body>
</html>
